services:
  postgres:
    image: postgres:16-alpine
    container_name: jetnine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jetnine
    ports:
      - "5432:5432"
    volumes:
      - jetnine_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jetnine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jetnine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jetnine_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jetnine_pg_data:
  jetnine_redis_data:
