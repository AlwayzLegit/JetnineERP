# Fly.io app config for the Jetnine API.
# Create the app once via `fly launch --no-deploy --copy-config` from apps/api,
# then set secrets with `fly secrets set ...` (DATABASE_URL, REDIS_URL,
# BETTER_AUTH_SECRET, SENTRY_DSN, STRIPE_SECRET_KEY, RESEND_API_KEY, etc.).

app = "jetnine-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
